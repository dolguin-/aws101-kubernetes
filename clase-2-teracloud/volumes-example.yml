apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
          - containerPort: 80
        volumeMounts:
          - name: config-volume
            mountPath: /config
            readOnly: true
          - name: secret-volume
            mountPath: /secrets
            readOnly: true
          - name: data-volume
            mountPath: /data
      volumes:
        - name: config-volume
          configMap:
            name: mi-config
            items:
              - key: CONFIG_FILE
                path: app.conf
        - name: secret-volume
          secret:
            secretName: mi-secret
        - name: data-volume
          persistentVolumeClaim:
            claimName: pvc-hostpath
