apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    app: init-demo
spec:
  initContainers:
  - name: init-setup
    image: busybox:1.28
    command: ['sh', '-c']
    args:
    - echo "Iniciando configuración...";
      sleep 30;
      echo "Configuración completada" > /shared-data/config.txt;
      echo "Init container terminado exitosamente"
    volumeMounts:
    - name: shared-volume
      mountPath: /shared-data
  containers:
  - name: main-app
    image: busybox:1.28
    command: ['sh', '-c']
    args:
    - echo "Aplicación principal iniciando...";
      cat /shared-data/config.txt;
      echo "Aplicación ejecutándose";
      sleep 3600
    volumeMounts:
    - name: shared-volume
      mountPath: /shared-data
  volumes:
  - name: shared-volume
    emptyDir: {}
