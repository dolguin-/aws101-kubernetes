apiVersion: v1
kind: ServiceAccount
metadata:
  name: mi-app-sa
  namespace: production
  labels:
    app: mi-aplicacion
    environment: prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/EKSServiceRole
automountServiceAccountToken: true
imagePullSecrets:
- name: docker-registry-secret
secrets:
- name: mi-app-sa-token
